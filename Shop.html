<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Navad Interns Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #333;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .product img {
            max-width: 100%;
            border-radius: 8px;
        }

        .product h3 {
            margin: 10px 0 5px;
        }

        .price {
            color: #27ae60;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
 
    </style>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; line-height: 1.6; }
        header { background: #634832; color: #ece0d1; padding: 1rem; text-align: center; }
        nav { background: #967259; color: #fff; padding: 0.5rem; text-align: center; }
        nav a { color: #ece0d1; margin: 0 10px; text-decoration: none; }
</style>
</head>
<body>

<header>
    <h1>My Shop</h1>
</header>

<div class="container">
    <div class="grid">
        
        <div class="product">
            <img src="https://via.placeholder.com/200" alt="Product 1">
            <h3>Product 1</h3>
            <p class="price">$19.99</p>
            <a href="#" class="btn">Preorder</a>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/200" alt="Product 2">
            <h3>Product 2</h3>
            <p class="price">$24.99</p>
            <a href="#" class="btn">Preorder</a>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/200" alt="Product 3">
            <h3>Product 3</h3>
            <p class="price">$14.99</p>
            <a href="#" class="btn">Preorder</a>
        </div>
 
        <div class="product">
            <img src="https://via.placeholder.com/200" alt="Product 4">
            <h3>Product 4</h3>
            <p class="price">$29.99</p>
            <a href="#" class="btn">Preorder</a>
        </div>
        <script>
            alert("This is a popup message!");

        fetch('./data.json')
  .then(res => res.json())
  .then(data => displayData(data));
    </script>
        
    </div>
    <iframe class="airtable-embed" src="https://airtable.com/embed/appeP4yAdDocorSvN/shrWW5JlujsEbqGyu?viewControls=on" frameborder="0" onmousewheel="" width="100%" height="533" style="background: transparent; border: 1px solid #ccc;"></iframe>
</div>

</body>
</html>
